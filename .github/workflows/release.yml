name: Release

# Runs when you push a version tag (e.g. v1.0.0) and attaches a ready-to-play
# download for Windows, macOS and Linux to the GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
          - os: ubuntu-latest
            platform: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Work out version number
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=1.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build a runtime with Java + JavaFX included
        run: mvn -B javafx:jlink

      - name: Package the game with jpackage
        run: |
          jpackage --type app-image \
            --name TurboDash \
            --app-version "$APP_VERSION" \
            --vendor "Turbo Dash Team" \
            --runtime-image target/turbodash \
            --module com.example.turbodash/com.example.turbodash.Start \
            --dest dist

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: cd dist && 7z a "../TurboDash-${{ matrix.platform }}.zip" TurboDash

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/TurboDash.app "TurboDash-${{ matrix.platform }}.zip"

      - name: Zip (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar -czf "../TurboDash-${{ matrix.platform }}.tar.gz" TurboDash

      - name: Keep the download on the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: TurboDash-${{ matrix.platform }}
          path: TurboDash-${{ matrix.platform }}.*

      - name: Attach to the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: TurboDash-${{ matrix.platform }}.*
